<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in – ServiceFusion Prototype</title>
<script src="gate.js"></script>
<style>
  :root { --page:#d9dbe0; --card:#fff; --text:#000; --text2:#6c6c70; --sep:rgba(60,60,67,.22); --field:rgba(118,118,128,.12); --accent:#3b82e0; --red:#ff453a; }
  [data-theme="dark"] { --page:#0b0b0d; --card:#1c1c1e; --text:#fff; --text2:#98989f; --sep:rgba(255,255,255,.14); --field:rgba(118,118,128,.24); }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:var(--page); color:var(--text);
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif; letter-spacing:-.011em; -webkit-font-smoothing:antialiased; }
  .card { width:100%; max-width:380px; background:var(--card); border-radius:22px; padding:34px 28px 26px; box-shadow:0 10px 40px rgba(0,0,0,.18); text-align:center; }
  .logo { width:64px; height:64px; margin:0 auto 18px; border-radius:16px; background:linear-gradient(135deg,#4a90e2,#2a5fb0); display:grid; place-items:center; color:#fff; }
  h1 { margin:0 0 6px; font-size:22px; font-weight:700; }
  p.sub { margin:0 0 24px; color:var(--text2); font-size:14.5px; line-height:1.45; }
  form { text-align:left; }
  label { display:block; font-size:13px; font-weight:600; color:var(--text2); margin:0 0 6px; }
  .field { position:relative; }
  input { width:100%; height:48px; border:1.5px solid transparent; border-radius:12px; background:var(--field); color:var(--text); font:inherit; font-size:16px; padding:0 64px 0 14px; outline:none; }
  input:focus { border-color:var(--accent); }
  .show { position:absolute; right:6px; top:6px; height:36px; padding:0 10px; border:0; background:none; color:var(--accent); font:inherit; font-size:14px; font-weight:600; cursor:pointer; }
  .err { min-height:20px; margin:8px 2px 14px; color:var(--red); font-size:13.5px; }
  .go { width:100%; height:50px; border:0; border-radius:14px; background:var(--accent); color:#fff; font:inherit; font-size:17px; font-weight:600; cursor:pointer; }
  .go:active { filter:brightness(.92); }
  .shake { animation:shake .35s; }
  @keyframes shake { 0%,100% { transform:translateX(0); } 25% { transform:translateX(-7px); } 75% { transform:translateX(7px); } }
  .foot { margin:18px 0 0; color:var(--text2); font-size:12.5px; line-height:1.45; }
</style>
</head>
<body>
<main class="card" id="card">
  <div class="logo"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg></div>
  <h1>ServiceFusion Field Worker</h1>
  <p class="sub">Roadmap prototype. Enter the access code to continue.</p>
  <form id="f" autocomplete="off">
    <label for="pw">Access code</label>
    <div class="field">
      <input id="pw" type="password" autocapitalize="off" autocorrect="off" spellcheck="false" autofocus aria-describedby="err">
      <button type="button" class="show" id="show" aria-label="Show access code">Show</button>
    </div>
    <div class="err" id="err" role="alert"></div>
    <button class="go" type="submit">Continue</button>
  </form>
  <p class="foot">Not sure what the code is? Ask whoever shared this link.</p>
</main>
<script>
  document.documentElement.dataset.theme = (function () { try { return localStorage.getItem('sf-theme') || 'dark'; } catch (e) { return 'dark'; } })();
  if (SFGate.ok()) location.replace(SFGate.next());
  var pw = document.getElementById('pw'), err = document.getElementById('err'), card = document.getElementById('card');
  document.getElementById('show').addEventListener('click', function () {
    var h = pw.type === 'password'; pw.type = h ? 'text' : 'password'; this.textContent = h ? 'Hide' : 'Show'; this.setAttribute('aria-label', (h ? 'Hide' : 'Show') + ' access code'); pw.focus();
  });
  document.getElementById('f').addEventListener('submit', function (e) {
    e.preventDefault();
    if (SFGate.check(pw.value)) { SFGate.signIn(); location.replace(SFGate.next()); return; }
    err.textContent = pw.value.trim() ? "That code didn't work. Try again." : 'Enter the access code.';
    card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake'); pw.select();
  });
</script>
</body>
</html>
