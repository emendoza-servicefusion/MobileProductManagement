<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ServiceFusion iOS – Technician Happy Path (v1) + Home &amp; Notifications</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#f2f2f7; --card:#fff; --bar:rgba(249,249,249,.94); --text:#000; --text2:#6c6c70; --text3:#aeaeb2;
    --sep:rgba(60,60,67,.18); --accent:#3b82e0; --accent-soft:rgba(59,130,224,.12);
    --green:#34c759; --orange:#ff9f0a; --purple:#af52de; --red:#ff453a; --yellow:#ffd60a;
    --seg-bg:rgba(118,118,128,.12); --seg-on:#fff; --scrim:rgba(0,0,0,.4); --page:#d9dbe0; --shadow:0 1px 2px rgba(0,0,0,.05);
    --panel:#fff;
  }
  [data-theme="dark"] {
    --bg:#1c1c1e; --card:#000; --bar:rgba(22,22,24,.92); --text:#fff; --text2:#98989f; --text3:#5a5a5f;
    --sep:rgba(84,84,88,.55); --accent:#4a90e2; --accent-soft:rgba(74,144,226,.18);
    --seg-bg:rgba(118,118,128,.28); --seg-on:#636366; --scrim:rgba(0,0,0,.6); --page:#0b0b0c; --shadow:none; --panel:#161618;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; }
  :root { --font:"Inter",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif; --track:-.011em; }
  [data-font="jakarta"] { --font:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif; --track:-.015em; }
  [data-font="system"] { --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif; --track:0em; }
  .phone { font-family:var(--font); letter-spacing:var(--track); -webkit-font-smoothing:antialiased; font-feature-settings:"cv11","ss03","tnum" 0; font-variant-numeric:tabular-nums; }
  .phone h1,.phone h2,.phone h3,.jcard .name { letter-spacing:-.022em; }
  body { background:var(--page); color:var(--text); font-family:var(--font); display:flex; align-items:center; justify-content:center; gap:40px; overflow:hidden; transition:background .25s; }
  button { font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; text-align:inherit; }
  svg { display:block; }
  #stage { width:393px; height:852px; flex:none; transform-origin:center; }
  .phone { position:relative; width:393px; height:852px; border-radius:55px; overflow:hidden; background:var(--bg); box-shadow:0 0 0 11px #111,0 0 0 12px #3a3a3c,0 30px 80px rgba(0,0,0,.4); transition:background .25s; }
  .island { position:absolute; top:11px; left:50%; width:124px; height:36px; margin-left:-62px; background:#000; border-radius:20px; z-index:200; }
  .statusbar { position:absolute; top:0; left:0; right:0; height:54px; z-index:190; display:flex; justify-content:space-between; align-items:center; padding:6px 34px 0 48px; font-weight:600; font-size:16px; pointer-events:none; }
  .statusbar .icons { display:flex; gap:6px; align-items:center; }
  .homebar { position:absolute; bottom:8px; left:50%; width:140px; height:5px; margin-left:-70px; border-radius:3px; background:var(--text); z-index:200; pointer-events:none; }
  .screen { position:absolute; inset:0; background:var(--bg); transition:transform .35s cubic-bezier(.2,.8,.2,1),background .25s; }
  #job { transform:translateX(100%); z-index:35; box-shadow:-8px 0 24px rgba(0,0,0,.15); }
  #job.open { transform:none; }
  #work.pushed,#home.pushed,#inbox.pushed { transform:translateX(-28%); }
  #inbox { transform:translateX(100%); z-index:31; box-shadow:-8px 0 24px rgba(0,0,0,.15); }
  #nset { transform:translateX(100%); z-index:40; box-shadow:-8px 0 24px rgba(0,0,0,.15); }
  #inbox.open,#nset.open { transform:none; }

  /* My Work */
  .header { position:absolute; top:0; left:0; right:0; padding:58px 16px 8px; display:flex; align-items:center; gap:10px; background:var(--bg); z-index:5; }
  .avatar { width:36px; height:36px; border-radius:50%; background:var(--seg-bg); display:grid; place-items:center; font-weight:600; font-size:14px; flex:none; }
  .header h1 { margin:0; font-size:20px; font-weight:700; flex:1; }
  .ibtn { width:36px; height:36px; display:grid; place-items:center; border-radius:50%; color:var(--accent); }
  .ibtn:active { background:var(--seg-bg); }
  .scroll { position:absolute; top:102px; bottom:84px; left:0; right:0; overflow-y:auto; scrollbar-width:none; padding-bottom:24px; }
  .scroll::-webkit-scrollbar { display:none; }
  .seg { margin:6px 16px 0; background:var(--seg-bg); border-radius:9px; padding:2px; display:flex; position:relative; }
  .seg button { flex:1; height:32px; border-radius:7px; font-size:13px; font-weight:500; text-align:center; position:relative; z-index:1; }
  .seg button.on { font-weight:600; }
  .seg .thumb { position:absolute; top:2px; bottom:2px; left:2px; background:var(--seg-on); border-radius:7px; box-shadow:0 2px 6px rgba(0,0,0,.12); transition:transform .25s cubic-bezier(.2,.8,.2,1); }
  .daterow { display:flex; justify-content:space-between; align-items:center; padding:16px 20px 8px; }
  .daterow b { font-size:20px; } .daterow span { color:var(--text2); font-size:20px; }
  .daterow .filters { color:var(--accent); font-size:15px; display:flex; gap:4px; align-items:center; }
  .sec-label { margin:14px 20px 8px; font-size:13px; color:var(--text2); text-transform:uppercase; letter-spacing:.02em; display:flex; justify-content:space-between; }

  .jcard { margin:0 16px 12px; background:var(--card); border-radius:16px; box-shadow:var(--shadow); overflow:hidden; display:block; width:calc(100% - 32px); transition:transform .12s; border:1.5px solid transparent; }
  .jcard:active { transform:scale(.985); }
  .jcard.next { border-color:var(--accent); }
  .jcard .top { display:flex; align-items:center; gap:10px; padding:8px 14px 0; min-height:52px; }
  .jcard .top .sp { flex:1; }
  .jcard .name { padding:6px 14px 0; font-weight:700; font-size:16px; line-height:1.25; letter-spacing:-.01em; }
  .jcard .body { padding:6px 14px 0; }
  .jcard .pri { font-size:16px; font-weight:600; margin-top:2px; display:flex; flex-wrap:wrap; align-items:baseline; column-gap:10px; }
  .jcard .loc { font-size:12px; color:var(--text); margin-top:4px; line-height:1.3; display:flex; align-items:center; gap:8px; }
  .acts { display:flex; gap:16px; margin-right:4px; }
  .actbtn { width:44px; height:44px; border-radius:12px; background:var(--accent-soft); color:var(--accent); display:grid; place-items:center; }
  .actbtn:active { filter:brightness(.85); transform:scale(.94); }
  .jcard .dur { font-size:12px; font-weight:400; color:var(--text2); }
  .jcard .sec { font-size:12px; color:var(--text2); margin-top:8px; line-height:1.5; padding-bottom:12px; }
  .jcard .quick { margin:0 14px 14px; display:flex; gap:10px; }
  .qbtn { flex:1; height:42px; border-radius:12px; background:var(--accent); color:#fff; font-weight:600; font-size:16px; display:flex; align-items:center; justify-content:center; gap:8px; text-align:center; }
  .qbtn:active { opacity:.8; }
  .jcard button.chip { font-size:14px; font-weight:600; min-height:32px; padding:0 12px; gap:7px; border-radius:18px; }
  .jcard button.chip svg { width:10px; height:7px; margin-left:1px; }
  button.chip { position:relative; cursor:pointer; }
  button.chip::after { content:""; position:absolute; inset:-10px -8px; }
  button.chip:active { filter:brightness(.85); transform:scale(.96); }
  .chip { display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:600; padding:3px 9px; border-radius:20px; white-space:nowrap; }
  .s-Scheduled { color:var(--accent); background:var(--accent-soft); }
  .s-OnTheWay { color:var(--orange); background:rgba(255,159,10,.16); }
  .s-OnSite { color:var(--purple); background:rgba(175,82,222,.16); }
  .s-Started { color:var(--green); background:rgba(52,199,89,.16); }
  .s-Paused { color:#c9a400; background:rgba(255,214,10,.2); }
  .s-Completed,.s-PartiallyCompleted { color:var(--text2); background:var(--seg-bg); }
  .done-row { margin:0 16px 8px; background:var(--card); border-radius:14px; padding:12px 14px; display:flex; align-items:center; gap:10px; width:calc(100% - 32px); color:var(--text2); font-size:15px; }
  .done-row b { color:var(--text); font-weight:600; flex:1; }

  .tabbar { position:absolute; bottom:0; left:0; right:0; height:84px; padding:8px 8px 0; display:flex; background:var(--bar); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); border-top:.5px solid var(--sep); z-index:20; }
  .tabbar button { flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; font-size:10px; font-weight:500; color:var(--text2); height:50px; text-align:center; }
  .tabbar button.on { color:var(--accent); }

  /* Job Details */
  .jnav { position:absolute; top:0; left:0; right:0; padding-top:54px; background:var(--card); z-index:6; border-bottom:.5px solid var(--sep); }
  .jnav .row1 { display:flex; align-items:center; justify-content:space-between; padding:0 12px; height:40px; font-size:15px; font-weight:500; }
  .jnav h2 { margin:0; text-align:center; font-size:22px; font-weight:700; padding:2px 0 8px; }
  .jtabs { display:flex; padding:0 12px; }
  .jtabs button { padding:8px 12px 10px; font-size:15px; font-weight:500; color:var(--text); border-bottom:2px solid transparent; }
  .jtabs button.on { color:var(--accent); border-color:var(--accent); }
  .jscroll { position:absolute; top:172px; bottom:0; left:0; right:0; overflow-y:auto; padding:14px 16px 170px; scrollbar-width:none; }
  .jscroll::-webkit-scrollbar { display:none; }
  .card { background:var(--card); border-radius:16px; box-shadow:var(--shadow); margin-bottom:12px; overflow:hidden; }
  .card .pad { padding:14px 16px; }
  .stat-top { display:flex; align-items:center; justify-content:space-between; }
  .stat-top .chip { font-size:14px; padding:4px 11px; }
  .link { color:var(--accent); font-size:15px; text-decoration:underline; }
  .timer { margin-top:14px; padding-top:12px; border-top:.5px solid var(--sep); display:flex; align-items:center; justify-content:space-between; color:var(--text2); font-size:15px; }
  .timer b { color:var(--green); font-variant-numeric:tabular-nums; font-size:20px; }
  .irow { display:flex; align-items:center; gap:12px; padding:12px 16px; }
  .irow + .irow { border-top:.5px solid var(--sep); }
  .irow .main { flex:1; min-width:0; }
  .irow .main small { display:block; color:var(--text2); font-size:13px; }
  .irow svg.lead { color:var(--text2); flex:none; }
  .circ { width:38px; height:38px; border-radius:50%; background:var(--accent-soft); color:var(--accent); display:grid; place-items:center; flex:none; }
  .shortcuts { display:flex; justify-content:space-between; margin:4px 0 14px; }
  .sc { width:64px; text-align:center; font-size:12px; font-weight:500; position:relative; }
  .sc .tile { width:60px; height:60px; border-radius:18px; background:var(--card); display:grid; place-items:center; color:var(--accent); margin:0 auto 6px; position:relative; box-shadow:var(--shadow); }
  .sc:active .tile { transform:scale(.94); }
  .badge { position:absolute; top:-6px; right:-8px; min-width:22px; height:22px; padding:0 6px; border-radius:11px; background:var(--accent); color:#fff; font-size:12px; font-weight:700; display:grid; place-items:center; border:2px solid var(--bg); }
  .badge.warn { background:var(--orange); }
  .badge.ok { background:var(--green); }
  .desc { font-size:15px; line-height:1.4; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .desc.open { display:block; }
  .desc.big { -webkit-line-clamp:6; }
  .descbox { display:block; width:100%; margin-top:14px; padding-top:12px; border-top:.5px solid var(--sep); text-align:left; }
  .descbox .dh { display:flex; justify-content:space-between; color:var(--text2); font-size:13px; margin-bottom:4px; }
  #descToggle { color:var(--accent); }
  .chev { color:var(--text3); flex:none; }
  .actionbar { position:absolute; left:0; right:0; bottom:0; padding:12px 16px 34px; background:var(--bar); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); border-top:.5px solid var(--sep); z-index:8; display:flex; gap:10px; }
  .pbtn { flex:1; height:54px; border-radius:14px; background:var(--accent); color:#fff; font-size:18px; font-weight:600; display:flex; align-items:center; justify-content:center; gap:10px; text-align:center; transition:transform .1s; }
  .pbtn:active { transform:scale(.98); opacity:.9; }
  .pbtn.green { background:var(--green); }
  .sbtn { width:54px; height:54px; border-radius:14px; background:var(--seg-bg); display:grid; place-items:center; flex:none; }
  .finished { flex:1; text-align:center; color:var(--text2); font-size:15px; align-self:center; line-height:1.4; }

  /* Sheets */
  .scrim { position:absolute; inset:0; background:var(--scrim); opacity:0; pointer-events:none; transition:opacity .3s; z-index:100; }
  .scrim.show { opacity:1; pointer-events:auto; }
  .sheet { position:absolute; left:0; right:0; bottom:0; background:var(--bg); border-radius:22px 22px 0 0; z-index:110; transform:translateY(105%); transition:transform .35s cubic-bezier(.2,.8,.2,1); display:flex; flex-direction:column; max-height:90%; }
  .sheet.open { transform:none; }
  .sheet.tall { height:88%; }
  .grab { width:36px; height:5px; border-radius:3px; background:var(--text3); margin:8px auto 0; flex:none; }
  .sheet-head { display:flex; align-items:center; justify-content:space-between; padding:10px 18px 8px; flex:none; }
  .sheet-head h3 { margin:0; font-size:19px; }
  .sheet-body { overflow-y:auto; padding:6px 16px 20px; flex:1; scrollbar-width:none; }
  .sheet-foot { padding:10px 16px 34px; flex:none; }
  .opt { display:flex; align-items:center; gap:12px; width:100%; padding:14px 16px; background:var(--card); font-size:17px; }
  .opt + .opt { border-top:.5px solid var(--sep); }
  .opt .chip { margin-left:auto; }
  .opt.cur { color:var(--accent); font-weight:600; }
  .group { border-radius:14px; overflow:hidden; background:var(--card); }
  textarea,input.txt { width:100%; border:0; border-radius:12px; background:var(--card); color:var(--text); font:inherit; font-size:17px; padding:12px 14px; resize:none; outline:none; }
  .note { background:var(--card); border-radius:14px; padding:12px 14px; margin-bottom:10px; font-size:16px; line-height:1.4; }
  .note small { display:block; color:var(--text2); font-size:12px; margin-top:6px; }
  .log { display:flex; gap:10px; padding:10px 4px; font-size:15px; }
  .log small { color:var(--text2); width:62px; flex:none; padding-top:2px; }
  .composer { display:flex; gap:8px; align-items:flex-end; padding:10px 12px 32px; background:var(--bar); border-top:.5px solid var(--sep); flex:none; }
  .composer textarea { flex:1; background:var(--seg-bg); border-radius:18px; padding:9px 14px; font-size:16px; max-height:90px; }
  .send { width:36px; height:36px; border-radius:50%; background:var(--accent); color:#fff; display:grid; place-items:center; flex:none; opacity:.4; }
  .send.on { opacity:1; }
  .empty { text-align:center; color:var(--text2); padding:40px 20px; font-size:15px; }
  .check { width:24px; height:24px; border-radius:50%; border:2px solid var(--text3); flex:none; display:grid; place-items:center; color:#fff; }
  .check.on { background:var(--accent); border-color:var(--accent); }
  .task.on span { color:var(--text2); text-decoration:line-through; }
  .nudge { display:flex; align-items:center; gap:12px; padding:12px 14px; background:var(--card); font-size:15px; }
  .nudge + .nudge { border-top:.5px solid var(--sep); }
  .nudge .ic { width:26px; height:26px; border-radius:50%; display:grid; place-items:center; flex:none; color:#fff; }
  .nudge .ic.ok { background:var(--green); } .nudge .ic.warn { background:var(--orange); }
  .nudge small { display:block; color:var(--text2); font-size:12px; }
  .nudge .go { margin-left:auto; color:var(--accent); font-size:14px; }
  .toast { position:absolute; left:50%; bottom:110px; transform:translate(-50%,20px); background:var(--text); color:var(--bg); padding:9px 16px; border-radius:20px; font-size:14px; opacity:0; transition:.25s; z-index:300; pointer-events:none; width:max-content; max-width:340px; text-align:center; }
  .toast.show { opacity:1; transform:translate(-50%,0); }

  /* ---------- Home + notifications ---------- */
  :root { --banner:rgba(250,250,252,.86); }
  [data-theme="dark"] { --banner:rgba(44,44,46,.88); }
  .bellbtn { position:relative; }
  .bell-ring { animation:ring .7s ease; transform-origin:50% 20%; }
  @keyframes ring { 0%,100% { transform:rotate(0); } 15% { transform:rotate(14deg); } 35% { transform:rotate(-12deg); } 55% { transform:rotate(8deg); } 75% { transform:rotate(-5deg); } }
  #homeBody { padding-bottom:110px; }
  .hcard { margin:0 16px 12px; background:var(--card); border-radius:16px; box-shadow:var(--shadow); overflow:hidden; }
  .greet { padding:2px 20px 10px; }
  .greet p { margin:2px 0 0; color:var(--text2); font-size:15px; }
  .sh { display:flex; justify-content:space-between; align-items:baseline; padding:20px 20px 8px; }
  .sh h3 { margin:0; font-size:20px; }
  .sh span { color:var(--text2); font-size:14px; }
  .pbanner { margin:0 16px 12px; padding:12px 14px; border-radius:14px; background:rgba(255,159,10,.14); border:.5px solid rgba(255,159,10,.5); display:flex; gap:12px; align-items:center; }
  .pbanner .pi { color:var(--orange); flex:none; }
  .pbanner b { display:block; font-size:15px; }
  .pbanner small { display:block; color:var(--text2); font-size:12.5px; line-height:1.3; margin-top:1px; }
  .pbanner button { background:var(--orange); color:#000; font-weight:600; font-size:14px; padding:7px 14px; border-radius:18px; flex:none; }
  .nu { position:relative; padding:14px; border:1.5px solid transparent; transition:border-color .2s; cursor:pointer; }
  .nu.warn { border-color:var(--orange); }
  .nu.late,.nu.left { border-color:var(--red); }
  .nu.onsite,.nu.working { border-color:var(--green); }
  .nu-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; gap:8px; }
  .eyebrow { font-size:12px; font-weight:700; letter-spacing:.06em; color:var(--text2); text-transform:uppercase; }
  .pill { display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:600; padding:3px 9px; border-radius:20px; white-space:nowrap; }
  .p-blue { background:var(--accent-soft); color:var(--accent); }
  .p-amber { background:rgba(255,159,10,.2); color:var(--orange); }
  .p-red { background:rgba(255,69,58,.18); color:var(--red); }
  .p-green { background:rgba(52,199,89,.2); color:var(--green); }
  .p-gray { background:var(--seg-bg); color:var(--text2); }
  .nu h4 { margin:0; font-size:22px; line-height:1.15; letter-spacing:-.02em; }
  .tags { display:flex; gap:6px; flex-wrap:wrap; margin:8px 0 0; }
  .tag { font-size:12px; font-weight:500; padding:2px 8px; border-radius:6px; background:var(--seg-bg); color:var(--text2); }
  .tag.chg { background:rgba(255,159,10,.2); color:var(--orange); font-weight:600; }
  .meta { display:flex; flex-direction:column; gap:6px; margin-top:12px; font-size:15px; }
  .meta div { display:flex; align-items:center; gap:9px; }
  .meta svg { color:var(--text2); flex:none; }
  .meta s { color:var(--text3); font-size:13px; margin-left:4px; }
  .tag.ctag { display:inline-flex; align-items:center; gap:5px; background:var(--accent-soft); color:var(--accent); font-weight:600; position:relative; }
  .tag.ctag::after { content:""; position:absolute; inset:-8px -6px; }
  .tag.ctag:active { filter:brightness(.85); }
  .cwho { display:flex; align-items:center; gap:14px; padding:6px 4px 16px; }
  .cwho .cav { width:52px; height:52px; border-radius:50%; background:var(--accent-soft); color:var(--accent); display:grid; place-items:center; font-weight:700; font-size:18px; flex:none; }
  .cwho b { display:block; font-size:20px; letter-spacing:-.02em; }
  .cwho small { color:var(--text2); font-size:14px; }
  .opt .cl { display:block; color:var(--text2); font-size:12px; margin-bottom:1px; }
  .cbtns { display:flex; gap:10px; margin-top:14px; }
  .nblock { display:flex; gap:9px; margin-top:12px; padding:10px 12px; border-radius:12px; background:var(--seg-bg); font-size:13.5px; line-height:1.35; }
  .nblock svg { flex:none; color:var(--text2); margin-top:1px; }
  .nblock .lbl { display:block; font-weight:600; font-size:12px; color:var(--text2); text-transform:uppercase; letter-spacing:.03em; margin-bottom:1px; }
  .nblock .clamp { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .nblock.open .clamp { display:block; }
  .nblock .tg { flex:none; align-self:flex-start; margin-top:1px; color:var(--text3); transition:transform .2s; }
  .nblock.open .tg { transform:rotate(180deg); }
  .nu .actions { display:flex; gap:8px; margin-top:14px; }

    warn:'<svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor"><rect x="6" y="2" width="2" height="6" rx="1"/><circle cx="7" cy="11" r="1.200"/></svg>',
    ok:'<svg width="14" height="14" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6.500l2.500 2.500L10 3"/></svg>'
  };

  /* ---------- state ---------- */
  let simMin, jobs, cur, sheetKind, notesTab, outcome, doneTimer;
  const fmt = m => { let h = Math.floor(m/60), mm = String(m%60).padStart(2,'0'); const ap = h>=12?'PM':'AM'; h = h%12||12; return `${h}:${mm} ${ap}`; };
  const cls = s => s.replace(/\s/g,'');
  const NEXT_STATUS = { 'Scheduled':'On The Way', 'On The Way':'On Site', 'On Site':'Started', 'Started':'Completed', 'Paused':'Started' };
  const FLOW = ['On The Way','On Site','Started','Completed'];

  function reset() {
    simMin = 9*60+12; notesTab = 'job'; outcome = 'Completed'; cur = null; sheetKind = null;
    const task = t => ({ t, d:false });
    jobs = [
      { id:0, name:'Priya Natarajan', addr:'2210 Maple Ave, Dublin, OH 43017', as:'Jordan Reyes', num:'1094418820', start:8*60, end:9*60, status:'Completed', completedAt:'8:52 AM', phone:'(614) 555-0113',
        desc:'Spring tune-up on 2-stage furnace and 3-ton AC. Replace filter, clean condenser coil.', tasks:['Replace 16x25x1 filter','Clean condenser coil','Check refrigerant charge'].map(t => ({ t, d:true })),
        notes:{ tech:[], job:[{ t:'Replaced filter, coil cleaned, charge within spec. Recommended Merv-11 filters going forward.', by:'Completion note · You · 8:52 AM' }] }, logs:[], photos:4 },
      { id:1, name:'Greenfield Family Dental', contact:'Dana Whitfield · Office Manager', addr:'1450 Polaris Pkwy, Suite B, Columbus, OH 43240', as:'Jordan Reyes', num:'1096626398', start:9*60+30, end:10*60+30, status:'Scheduled', phone:'(614) 555-0142',
        desc:'RTU-2 not cooling – suite B reading 80°F with patients in. Check contactor, run capacitor and condenser fan motor. Roof access via hatch in supply closet; key at front desk.',
        tasks:['Lock out / tag out RTU-2','Test contactor and run capacitor','Check condenser fan motor amps','Measure superheat and subcooling','Photograph unit data plate'].map(task),
        notes:{ tech:[], job:[{ t:'Dana is the on-site contact. Park in the rear lot – front spaces are patient parking only.', by:'Office · Yesterday 4:05 PM' }] }, logs:[], photos:0, stamps:{} },
      { id:2, name:'Sandra Kowalczyk', addr:'925 Cherry Bottom Rd, Gahanna, OH 43230', as:'Jordan Reyes, Monica Margam', num:'1099230474', start:13*60, end:15*60, status:'Scheduled', phone:'(614) 555-0178',
        desc:'Replace 50-gal gas water heater (customer purchased unit, in garage). Haul away old tank. Customer will be home after 12:30.',
        tasks:['Shut off gas and water supply','Drain and disconnect old unit','Set and level new 50-gal tank','Connect gas, water and venting','Test PRV and check for leaks','Haul away old tank'].map(task),
        notes:{ tech:[], job:[] }, logs:[], photos:0, stamps:{} },
      { id:3, name:'Olentangy Bistro', contact:'Marcus Bell · Kitchen Manager', addr:'2150 W Dublin-Granville Rd, Columbus, OH 43235', as:'Jordan Reyes', num:'1099231105', start:15*60+30, end:16*60+30, status:'Scheduled', phone:'(614) 555-0119',
        desc:'Walk-in cooler holding 46°F, should be 38°F. Check evaporator fan, defrost cycle and door gasket. Use the back delivery entrance.',
        tasks:['Check evaporator fan and coil','Test defrost heater and timer','Inspect door gasket','Log box temp after 20 min'].map(task),
        notes:{ tech:[], job:[{ t:'Product is being moved to the reach-in – please keep door openings to a minimum.', by:'Office · Today 7:48 AM' }] }, logs:[], photos:0, stamps:{} }
    ];
    jobs.forEach(j => j.type = 'job');
    jobs.push(
      { id:4, type:'estimate', name:'Elena & Marcus Okafor', addr:'3318 Brookside Ln, Dublin, OH 43017', as:'Jordan Reyes', num:'1023440812', start:11*60+30, end:12*60+15, status:'Estimate Provided', phone:'(614) 555-0190', tasks:[], notes:{tech:[],job:[]}, logs:[] }
    );
    jobs[0].email = 'priya.natarajan@example.com'; jobs[1].email = 'dana.whitfield@greenfielddental.com'; jobs[2].email = 'sandra.k@example.com';
    jobs[3].email = 'marcus.bell@olentangybistro.com'; jobs[4].email = 'okafor.family@example.com';
    // Tech notes surface on Home's Next Up card (latest one shown)
    jobs[1].notes.tech.push({ t: 'Last visit the run capacitor tested weak and the contactor was pitted. Bring a spare 40/5 and a contactor, and photograph the data plate. Roof ladder is in the supply closet, hatch is padlocked.', by: 'Tech note · Marcus T. · Sep 22' });
    jobs[2].notes.tech.push({ t: 'Gas shutoff is behind the garage freezer, so move it before you start. Dog is friendly but loud; customer will crate him if you call ahead. Old tank is 80 lb, bring the dolly.', by: 'Tech note · Priya N. · Aug 14' });
    jobs[3].notes.tech.push({ t: 'Back delivery entrance code is 2290. Ask for Marcus at the dish station. Kitchen is slammed 11:30 to 1:30, so keep door openings short and check the gasket before pulling the evaporator cover.', by: 'Tech note · Daniel O. · Oct 2' });
    jobs[1].products = [{ pid: 'fan14', qty: 1 }, { pid: 'cont40', qty: 1 }];
    closePO(true); poDraft = null; compDraft = ''; afterSheet = null;
    resetNotif(); closeInbox(); drawerOpen(false); hideBanner(); renderDemo();
    renderList(); closeJob(true); closeSheet(); setTab('home'); renderAll();
  }
  const updateClock = () => { $('#clock').textContent = fmt(simMin).replace(/ (AM|PM)/,''); };
  const advanceClock = n => { simMin += n; updateClock(); };

  /* ---------- My Work ---------- */
  const isActive = j => !['Completed', 'Partially Completed', 'Ready for Office Review'].includes(j.status) && !j.cancelled;

  /* Object-type iconography: Job / Estimate / Task, icon + colour vary by that type's status.
     Confirmed from the app: Job Scheduled, Job Dispatched, Estimate Provided, Estimate Accepted,
     Task Incomplete, Task Completed. Every other job status below is a PROVISIONAL guess in the same family. */
  const COL = { green:'#34c759', orange:'#ff9f0a', purple:'#af52de', yellow:'#e6b800', gray:'#8e8e93' };
  const svg = (inner, s = 30) => `<svg class="ico" width="${s}" height="${s}" viewBox="0 0 32 32" fill="none" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
  const G = {
    calCheck: (c, filled) => svg(`<rect x="3" y="6" width="26" height="22" rx="3" ${filled ? `fill="${c}" stroke="${c}"` : `stroke="${c}"`} stroke-width="2.4"/><path d="M10 2.500v6M22 2.500v6" stroke="${c}" stroke-width="2.4"/>${filled ? '' : `<path d="M3 12h26" stroke="${c}" stroke-width="2"/>`}<path d="M10.500 18.500l4 4 7-8" stroke="${filled ? '#fff' : c}" stroke-width="2.600"/>`),
    clock: c => svg(`<circle cx="16" cy="16" r="13" stroke="${c}" stroke-width="2.800"/><path d="M16 8.500v8l5 3.500" stroke="${c}" stroke-width="2.800"/>`),

    estimate: (c, ok) => svg(`<path d="M7 3h13l6 6v20H7z" stroke="${c}" stroke-width="2.400"/><path d="M20 3v6h6" stroke="${c}" stroke-width="2.200"/><text x="16" y="21" font-size="11" font-weight="700" text-anchor="middle" fill="${c}" stroke="none" font-family="-apple-system,Arial">$</text>${ok ? `<path d="M19 27l3 3 6-7" stroke="${c}" stroke-width="2.400" fill="var(--card)"/>` : ''}`)
  };
  function iconSpec(o) {
    if (o.type === 'estimate') return { c: o.status === 'Estimate Accepted' ? COL.orange : COL.green, html: c => G.estimate(c, o.status === 'Estimate Accepted') };
    if (o.type === 'task') return o.status === 'Completed' ? { c: COL.green, html: c => G.calCheck(c, true) } : { c: COL.orange, html: c => G.clock(c) };
    switch (o.status) {
      case 'Scheduled':           return { c: COL.green,  html: c => G.calCheck(c, false) };
      case 'Dispatched':          return { c: COL.green,  html: c => G.person(c) };
      case 'On The Way':          return { c: COL.orange, html: c => G.person(c) };     // provisional
      case 'On Site':             return { c: COL.purple, html: c => G.person(c) };     // provisional
      case 'Started':             return { c: COL.green,  html: c => G.person(c) };     // provisional
      case 'Paused':              return { c: COL.yellow, html: c => G.person(c) };     // provisional
      case 'Partially Completed': return { c: COL.orange, html: c => G.calCheck(c, true) }; // provisional
      case 'Completed':           return { c: COL.green,  html: c => G.calCheck(c, true) }; // provisional
      case 'Waiting on Parts':    return { c: COL.orange, html: c => G.clock(c) };
      case 'Ready for Office Review': return { c: COL.purple, html: c => G.calCheck(c, true) };
      default:                    return { c: COL.gray,   html: c => G.calCheck(c, false) };
    }
  }

  }

  const typeTitle = o => o.type === 'task' ? (o.status === 'Completed' ? 'Completed Task' : 'Incomplete Task') : o.name;

  function renderList() {
    const active = jobs.filter(isActive).sort((a, b) => a.start - b.start), done = jobs.filter(j => !isActive(j) && !j.cancelled);
    const nextJob = active.find(j => j.type === 'job' && j.status !== 'Waiting on Parts'), nextId = nextJob ? nextJob.id : -1;
    let h = '';
    active.forEach(j => {
      const next = j.id === nextId;
      h += `<div class="jcard ${next?'next':''}" data-act="open" data-id="${j.id}" role="button">
        <div class="top">${objIcon(j)}${chip(j)}<span class="sp"></span>${j.type === 'job' || j.type === 'estimate' ? `<div class="acts">

          <div class="pri"><span>${fmt(j.start)} – ${fmt(j.end)}</span><span class="dur">Duration ${dur(j)}</span></div>
          <div class="loc"><span>${j.type === 'task' ? j.desc : j.addr.replace(/,\s*[A-Z]{2}\s*\d{5}(-\d{4})?$/, '')}</span></div>
          <div class="sec">${j.type === 'estimate' ? 'Estimate' : 'Job'} #${j.num}<br>Assigned To: ${j.as || 'Unassigned'}${partsLine(j)}</div>
        </div>
      </div>`;

  let S = freshS(), nid = 100, tab = 'home';
  function resetNotif() { S = freshS(); nid = 100; }

  /* ---------- derived job state ---------- */
  const win = j => ({ ws: j.start, we: j.start + 60 });   // arrival window: first hour of the scheduled slot (placeholder for the real arrival window)
  const activeJobs = () => jobs.filter(j => j.type === 'job' && isActive(j)).sort((a, b) => a.start - b.start);
  function phase(j) {
    if (!isActive(j)) return 'done';
    if (j.status === 'Waiting on Parts') return 'waiting';
    if (WORKING.includes(j.status)) return j.leftEarly ? 'left' : j.status === 'Started' ? 'working' : j.status === 'Paused' ? 'paused' : 'onsite';
    const { we } = win(j);
    if (simMin > we) return 'late';
    if (simMin >= we - 15) return 'warn';
    return j.status === 'On The Way' ? 'enroute' : 'upcoming';
  }
  // A visit you left without completing stays on Next up (red) until it is completed.
  const nextUp = () => activeJobs().find(j => j.status !== 'Waiting on Parts');
  function pillFor(j) {
    const { ws, we } = win(j);

      case 'upcoming': return simMin < ws ? { t: `Starts in ${mins(ws - simMin)}`, c: 'blue' } : { t: `Window open · closes in ${mins(we - simMin)}`, c: 'blue' };
      case 'enroute':  return { t: 'On the way', c: 'blue' };
      case 'warn':     return { t: `Window closes in ${mins(we - simMin)}`, c: 'amber' };
      case 'late':     return { t: `Window passed ${mins(simMin - we)} ago`, c: 'red' };
      case 'onsite':   return { t: `On site · ${mins(Math.max(1, simMin - (j.onsiteAt ?? simMin)))}`, c: 'green' };
      case 'working':  return { t: 'In progress', c: 'green' };
      case 'paused':   return { t: 'Paused', c: 'amber' };

  }
  function homePrimary(j) {

    if (j.status === 'Scheduled' && (p === 'warn' || p === 'late' || simMin >= win(j).ws)) return { l: 'Mark On Site', v: 'onsite', k: p === 'warn' || p === 'late' ? 'warn' : '' };

  /* ---------- Home ---------- */
  // Primary contact for a job: name, role, mobile, email. Falls back to the customer when no separate contact is set.

      <div class="meta">

        <div>${ic('pin', 18)}<span>${j.addr.replace(/,\s*[A-Z]{2}\s*\d{5}(-\d{4})?$/, '')}</span></div>
      </div>

        <button class="hbtn sec" data-act="toast" data-msg="Opening driving directions…" aria-label="Navigate">${ic('nav', 20)}</button>
        <button class="hbtn sec" data-act="cardNotes" data-id="${j.id}" aria-label="Notes for ${j.name}">${I.notes.replace('width="28" height="28"', 'width="22" height="22"')}</button>

  }
  function renderHome() {
    const body = $('#homeBody'); if (!body) return;

    h += `<div class="sh"><h3>Shortcuts</h3></div><div class="qa">
      ${[['users', 'Customers'], ['catalog', 'Catalogs'], ['box', 'Inventory'], ['map', 'Map View'], ['cloud', 'FusionDrive']].map(([i, l]) => `<button class="qt" data-act="toast" data-msg="${l} – coming soon">${ic(i, 26)}${l}</button>`).join('')}</div>`;
    body.innerHTML = h;

    body.querySelectorAll(".nblock[data-act=hexp]:not(.open)").forEach(b => {

  /* ---------- bell ---------- */
  const unreadCount = () => S.notifs.filter(n => n.unread).length;

  /* ---------- create, deliver, act ---------- */

  // Called from setStatus, so a notification resolves no matter where the status was changed.
  function resolveNotifs(j, s) {

  /* ---------- triggers ---------- */
  const skip = label => toast(`Not sent — you turned off “${label}”`);
  const locName = () => S.loc === 'while' ? 'While Using' : 'Never';
  function trig(v) {
    const t = nextUp();
    if (v === 'morning') {
      if (!S.prefs.morning) return skip('Morning reminder');
      const rem = activeJobs(); if (!rem.length) return toast('No jobs left today');
      const f = rem[0];
      return deliver(notify('morning', { title: `Today: ${rem.length} job${rem.length === 1 ? '' : 's'} to go`, body: `First up: ${f.name} at ${fmt(f.start)}. ${f.desc.split('. ')[0].replace(/\.$/, '')}.`, job: f.id }));
    }
    if (v === 'arrive') {
      if (!S.prefs.arrive) return skip('Arriving at a job');
      if (S.loc !== 'always') return toast(`Didn't fire — location is “${locName()}”, so the geofence can't wake the app`);
      if (!t) return toast('No jobs left to arrive at');
      if (WORKING.includes(t.status)) return toast('Not sent — already On Site');
      simMin = Math.max(simMin, win(t).ws + 2); updateClock();

    }
    if (v === 'warn') {
      if (!S.prefs.window) return skip('Arrival window closing');
      if (!t) return toast('No jobs left');
      if (WORKING.includes(t.status)) return toast('Not sent — already On Site');
      if (simMin > win(t).we) return toast('Window already passed');
      simMin = Math.max(simMin, win(t).we - 15); updateClock();
      return deliver(notify('window', { title: 'Arrival window closing', body: `Your window for ${t.name} closes at ${fmt(win(t).we)}. You're not marked On Site yet.`, job: t.id, action: 'onsite' }));
    }
    if (v === 'depart') {
      if (!S.prefs.depart) return skip('Leaving without Complete');
      if (S.loc !== 'always') return toast(`Didn't fire — location is “${locName()}”, so leaving the site can't be detected`);
      const a = activeJobs().find(x => WORKING.includes(x.status) && !x.leftEarly) || t;
      if (!a) return toast('No jobs to leave');
      if (!WORKING.includes(a.status)) { simMin = Math.max(simMin, win(a).ws + 2); setStatus(a, 'On Site', { minutes: 0 }); }
      simMin = Math.max(simMin, (a.onsiteAt ?? simMin) + 55); updateClock();
      a.leftEarly = true; a.leftAt = simMin;
      return deliver(notify('depart', { title: `Leaving ${a.name}?`, body: `You haven't marked this job Complete. Update the status before your next stop.`, job: a.id, action: 'complete' }));
    }
    if (v === 'changed') {
      if (!S.prefs.changed) return skip('Schedule changed');
      const a = [...activeJobs()].reverse().find(x => !x.changed && x.status === 'Scheduled' && (!t || x.id !== t.id));
      if (!a) return toast('Nothing left to reschedule');
      a.changed = { start: a.start, end: a.end }; a.start += 60; a.end += 60;
      return deliver(notify('changed', { title: 'Schedule changed', body: `${a.name} moved to ${rng(a.start, a.end)} (was ${rng(a.changed.start, a.changed.end)}).`, job: a.id }));
    }
    if (v === 'assigned') {
      if (!S.prefs.assigned) return skip('Job assigned');

        desc: 'No-cool call. Outdoor unit hums but the condenser fan is not spinning.', tasks: ['Check capacitor and fan motor', 'Measure amp draw', 'Quote repair'].map(x => ({ t: x, d: false })),
        notes: { tech: [], job: [] }, logs: [], photos: 0, stamps: {} });
      return deliver(notify('assigned', { title: 'New job assigned to you', body: `Harriet Lindqvist · ${rng(16 * 60 + 45, 17 * 60 + 45)} · 412 Elm St, Westerville`, job: id }));
    }
    if (v === 'cancelled') {
      if (!S.prefs.cancelled) return skip('Job cancelled');

      a.cancelled = true;

  // 2. The PO (or request) itself, prefilled with the job and customer

      ${can().po ? '' : '<p class="snote">Optional. The office makes the final vendor choice.</p>'}` };

  function poReview(j) {
    const d = poDraft, total = d.items.reduce((a, i) => a + prod(i.pid).cost * i.qty, 0), newOnes = d.items.filter(i => i.src === 'new');

        ? act('toast', 'doc', 'View PO').replace('data-act="toast"', 'data-act="toast" data-msg="PO PDF preview"') + act('toast', 'mail', 'Email').replace('data-act="toast"', `data-act="toast" data-msg="Emailing ${p.num} to ${vname(p.vendor)}…"`) + act('toast', 'share', 'Share').replace('data-act="toast"', 'data-act="toast" data-msg="Share sheet"') + (p.st === 'approved' || p.st === 'awaiting' ? act('po-del', 'trash', 'Delete', 'danger') : '')
        : act('toast', 'doc', 'View').replace('data-act="toast"', 'data-act="toast" data-msg="Request details"') + (p.st === 'awaiting' ? act('po-del', 'trash', 'Cancel', 'danger') : '')}</div>`;

  function submitPO() {
    const j = J(), p = pt(j), d = poDraft;
    p.items = d.items.map(i => ({ pid: i.pid, qty: i.qty, rcv: 0, src: i.src }));
    p.vendor = d.vendor; p.notes = d.notes; p.createdAt = fmt(simMin); p.byOffice = false;
    if (d.addJob) d.items.filter(i => i.src === 'new').forEach(i => { j.products = j.products || []; if (!j.products.some(x => x.pid === i.pid)) j.products.push({ pid: i.pid, qty: i.qty, pending: true }); });

  /* ---------- sheets: waiting, parts used, add job products, signature, completion checklist ---------- */
  function ckItems(j) {
    const p = pt(j), td = tasksDone(j), tn = j.tasks.length, nc = j.notes.tech.length + j.notes.job.length + (compDraft.trim() ? 1 : 0), L = [];
    L.push({ t: 'Customer signature', req: true, ok: !!j.sig, sub: j.sig ? 'Signed' : 'Needed before you can finish', act: 'sign', l: 'Sign' });
    if (p.st !== 'none') L.push({ t: 'Parts used recorded', ok: p.used, sub: p.used ? 'Recorded on the job' : 'Confirm what you installed', act: 'confirmParts', l: 'Confirm' });
    if (tn) L.push({ t: 'Tasks', ok: td === tn, sub: td === tn ? 'All tasks done' : `${tn - td} of ${tn} not done`, act: 'reviewTasks', l: 'Review' });
    L.push({ t: 'Photos', ok: j.photos > 0, sub: j.photos > 0 ? `${j.photos} added` : 'No photos added', act: 'addPhoto', l: 'Add' });

    return L;
  }
  function ckStats(j) {

      : `<div class="group"><div class="nudge"><span class="ic na">${ic('lock', 14, 2.2)}</span><div>Invoicing and payment<small>The office handles these after you hand off.</small></div></div></div>`;
    return h;
  }
  function ckFootHTML(j) {
    const rl = ckStats(j).reqLeft, lbl = can().fin ? (outcome === 'Completed' ? 'Complete Job' : 'Mark Partially Completed') : 'Ready for Office Review';
    return `<button class="pbtn ${rl ? 'dis' : can().fin ? 'green' : ''}" style="width:100%" data-act="confirmComplete">${lbl}</button>${rl ? `<div class="hint" style="text-align:center;color:var(--text2);font-size:13px;margin-top:8px">${rl} required item left</div>` : ''}`;
  }
  const refreshCk = () => { const j = J(); if (sheetKind !== 'complete' || !j) return; $('#ckBox').innerHTML = ckHTML(j); $('#ckFoot').innerHTML = ckFootHTML(j); };

  function renderPOSheet(sh, j) {
    const head = (t, r) => `<div class="grab"></div><div class="sheet-head"><h3>${t}</h3><button class="link" style="text-decoration:none" data-act="closeSheet">${r || 'Cancel'}</button></div>`;

          <div class="group">${avail.map(x => { const p = prod(x.pid), on = jpSel[x.pid] !== undefined; return `<div class="opt task ${on ? 'on' : ''}" style="cursor:default"><button class="check ${on ? 'on' : ''}" data-act="jp-toggle" data-p="${x.pid}" aria-label="Select ${p.name}">${on ? I.tick : ''}</button><span style="flex:1;min-width:0"><b style="font-weight:600;font-size:16px;text-decoration:none;display:block">${p.name}</b><small class="cl" style="margin:2px 0 6px">On job × ${x.qty}</small>${stockPill(p)}</span>${on ? stepHTML('jp-qty', x.pid, jpSel[x.pid]) : ''}</div>`; }).join('')}</div></div>
        <div class="sheet-foot"><button class="pbtn" style="width:100%" data-act="jp-add">Add to ${can().po ? 'PO' : 'Request'}</button></div>`;
    }

          <div style="position:relative"><canvas id="sigPad"></canvas><span id="sigHint" style="position:absolute;left:0;right:0;top:50%;text-align:center;color:#999;pointer-events:none;font-size:15px">Sign here</span></div></div>
        <div class="sheet-foot" style="display:flex;gap:10px"><button class="pbtn ghost" style="flex:none;padding:0 22px" data-act="sig-clear">Clear</button><button class="pbtn" data-act="sig-save">Save Signature</button></div>`;

      sh.innerHTML = head('Complete Job') + `<div class="sheet-body">

            <button class="${outcome === 'Completed' ? 'on' : ''}" data-act="outcome" data-o="Completed">Completed</button><button class="${outcome !== 'Completed' ? 'on' : ''}" data-act="outcome" data-o="Partially Completed">Partially Completed</button></div>`
            : '<div class="handoff">' + ic('users', 18, 2) + '<span>You are handing this job back to the office. They will invoice and close it out.</span></div>'}
          <div style="font-size:13px;color:var(--text2);margin:0 4px 6px">COMPLETION NOTES</div>
          <textarea id="compNote" rows="3" placeholder="What was done? Anything the office should know?"></textarea>
          <div id="ckBox">${ckHTML(j)}</div></div>
        <div class="sheet-foot" id="ckFoot">${ckFootHTML(j)}</div>`;
      const cn = $('#compNote'); cn.value = compDraft; cn.oninput = () => { compDraft = cn.value; refreshCk(); };
    }
  }
  function initSign() {
    const c = $('#sigPad'); if (!c) return; sigDirty = false; c.width = 680; c.height = 340;
    const x = c.getContext('2d'); x.lineWidth = 5; x.lineCap = 'round'; x.lineJoin = 'round'; x.strokeStyle = '#111';
    const pos = ev => { const r = c.getBoundingClientRect(); return [(ev.clientX - r.left) * c.width / r.width, (ev.clientY - r.top) * c.height / r.height]; };
    let down = false;
    c.onpointerdown = ev => { down = true; c.setPointerCapture(ev.pointerId); const [px, py] = pos(ev); x.beginPath(); x.moveTo(px, py); x.lineTo(px + .1, py + .1); x.stroke(); sigDirty = true; const h = $('#sigHint'); if (h) h.style.display = 'none'; };
    c.onpointermove = ev => { if (!down) return; const [px, py] = pos(ev); x.lineTo(px, py); x.stroke(); };
    c.onpointerup = c.onpointercancel = () => { down = false; };
  }
  // Sheets opened from the checklist return to it afterwards.

  /* ---------- demo: persona + things that happen outside the app ---------- */
  function demoStep() {
    const j = jobs[1], p = pt(j);
    const bump = (m, text) => { advanceClock(m); log(j, text); };
    switch (p.st) {
      case 'awaiting': return { l: 'Office approves your request', f() { p.st = 'approved'; p.byOffice = true; p.num = 'PO-1042'; p.vendor = p.vendor || 'pwr'; bump(10, 'Request approved · PO-1042 created by the office'); } };
      case 'approved': return { l: 'PO sent to the vendor', f() { p.st = 'sent'; p.io = 'IO-2207'; bump(5, `${p.num} sent to ${vname(p.vendor)}`); } };
      case 'sent': return p.items.length > 1
        ? { l: 'Vendor ships part 1 of ' + p.items.length + ' (partial)', f() { p.items[0].rcv = p.items[0].qty; p.st = 'partial'; bump(45, '1 of ' + p.items.length + ' parts received'); } }
        : { l: 'Part received at the shop', f() { p.items[0].rcv = p.items[0].qty; p.st = 'received'; bump(45, 'Part received · ready to schedule'); } };
      case 'partial': return { l: 'Remaining part received', f() { p.items.forEach(i => i.rcv = i.qty); p.st = 'received'; bump(40, 'All parts received · ready to schedule'); } };
      case 'received': return { l: 'Dispatch schedules the return visit', f() { const s = Math.ceil((simMin + 30) / 5) * 5; p.visitStart = s; p.visit = fmt(s); p.st = 'scheduled'; bump(5, 'Return visit scheduled for ' + fmt(s)); } };
      case 'scheduled': return j.ret ? null : { l: 'Go to the return visit', f() {
        j.ret = true; j.status = 'Scheduled'; j.start = p.visitStart; j.end = p.visitStart + 45; j.stamps = {}; j.leftEarly = false; j.sig = false; j.paid = false;
        simMin = Math.max(simMin, p.visitStart - 25); updateClock(); log(j, 'Return visit scheduled'); } };
      default: return null;
    }
  }
  function demoHTML() {
    const s = demoStep();
    return `<div class="dlab">Technician permissions</div>
      <div class="dm">${Object.entries(PERSONAS).map(([k, v]) => `<button class="${persona === k ? 'on' : ''}" data-act="persona" data-v="${k}">${v.name}</button>`).join('')}</div>
      <div class="dlab">Simulate what happens outside the app</div>
      <button class="adv" data-act="demo-next" ${s ? '' : 'disabled'}>${s ? '▸ ' + s.l : 'Start a parts request first'}</button>`;
  }
  const renderDemo = () => { const el = $('#demoPop'); if (el) el.innerHTML = `<h4>Demo controls</h4>${demoHTML()}<div class="ctl"><button data-act="reset">↺ Reset</button><button data-act="theme">◐ Light / Dark</button></div>`; };
  function refreshAll() {
    if (cur !== null) renderJob();
    renderList(); renderHome(); renderDemo();
    if (poOpen) renderPO();
    if (sheetKind === 'complete') { refreshCk(); }
    renderPanel(panelKind);
  }

  /* ---------- events ---------- */
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]'); if (!el) return;
    const d = el.dataset, j = (cur !== null || sheetTarget !== null) ? J() : null;
    switch (d.act) {
      case 'demo-toggle': $('#demoPop').classList.toggle('show'); break;
      case 'persona': persona = d.v; if (sheetKind === 'status' || sheetKind === 'complete') renderSheet(); refreshAll(); toast('Permissions: ' + PERSONAS[persona].name); break;
      case 'demo-next': { const s = demoStep(); if (s) { s.f(); refreshAll(); toast(s.l); } break; }
      case 'parts': if (cur !== null) { if (pt(j).st === 'none') { poDraft = newDraft(); openPO('needs'); } else openPO('detail'); } break;
      case 'po-back': { const b = PO_BACK[poView]; if (b) goPO(b); else closePO(); break; }
      case 'po-toggle': { const it = poDraft.items.find(i => i.pid === d.p); if (it) poDraft.items.splice(poDraft.items.indexOf(it), 1); else poDraft.items.push({ pid: d.p, qty: 1, src: (j.products || []).some(x => x.pid === d.p) ? 'job' : 'new' }); renderPO(); break; }
      case 'po-qty': { const it = poDraft.items.find(i => i.pid === d.p); if (it) { it.qty += +d.d; if (it.qty < 1) poDraft.items.splice(poDraft.items.indexOf(it), 1); } renderPO(); break; }
      case 'po-remove': poDraft.items = poDraft.items.filter(i => i.pid !== d.p); renderPO(); break;
      case 'po-next': if (!poDraft.items.length) toast('Select at least one part'); else goPO('form'); break;
      case 'po-more': goPO('needs'); break;
      case 'po-vendor': goPO('vendor'); break;
      case 'po-pick': poDraft.vendor = d.v; goPO('form'); break;
      case 'po-addjob': poDraft.addJob = !poDraft.addJob; renderPO(); break;
      case 'po-jp': jpSel = {}; (j.products || []).filter(x => !poDraft.items.some(i => i.pid === x.pid)).forEach(x => jpSel[x.pid] = x.qty); openSheet('addjobprods'); break;
      case 'jp-toggle': if (jpSel[d.p] !== undefined) delete jpSel[d.p]; else jpSel[d.p] = (j.products.find(x => x.pid === d.p) || { qty: 1 }).qty; renderSheet(); break;
      case 'jp-qty': jpSel[d.p] = Math.max(1, jpSel[d.p] + +d.d); renderSheet(); break;
      case 'jp-add': Object.keys(jpSel).forEach(pid => poDraft.items.push({ pid, qty: jpSel[pid], src: 'job' })); closeSheet(); renderPO(); break;
      case 'po-review': if (!poDraft.items.length) toast('Add at least one product'); else if (can().po && !poDraft.vendor) toast('Choose a vendor'); else goPO('review'); break;
      case 'po-confirm': submitPO(); break;
      case 'po-send': { const p = pt(j); p.st = 'sent'; p.io = 'IO-2207'; log(j, `${p.num} sent to ${vname(p.vendor)}`); advanceClock(5); toast(`${p.num} sent to ${vname(p.vendor)}`); refreshAll(); break; }
      case 'po-del': { const p = pt(j); Object.assign(p, { st: 'none', items: [], vendor: null, notes: '', num: null, io: null, createdAt: '' }); j.products = (j.products || []).filter(x => !x.pending); log(j, 'Part request removed'); toast(can().po ? 'Purchase order deleted' : 'Request cancelled'); closePO(); refreshAll(); break; }
      case 'po-wait': case 'wait-open': openSheet('waiting'); break;
      case 'wait-parts': closeSheet(); setTimeout(() => { poDraft = newDraft(); openPO('needs'); }, 380); break;
      case 'wait-confirm': {
        const p = pt(j), v = $('#waitNote').value.trim(); p.waitAt = fmt(simMin);
        if (v) { j.notes.job.push({ t: v, by: `Waiting on parts · You · ${fmt(simMin)}` }); log(j, 'Note added'); }
        closeSheet(); if (poOpen) closePO(true); setStatus(j, 'Waiting on Parts', { minutes: 3 });
        toast('Waiting on Parts · office notified'); clearTimeout(doneTimer); doneTimer = setTimeout(() => { if (cur !== null) closeJob(); }, 1300); break;
      }
      case 'confirmParts': { const p = pt(j); usedDraft = {}; p.items.forEach(i => { const e = (j.products || []).find(x => x.pid === i.pid); usedDraft[i.pid] = p.used && e ? e.qty : i.rcv; }); if (sheetKind === 'complete') { afterSheet = 'complete'; closeSheet(); setTimeout(() => openSheet('used'), 380); } else openSheet('used'); break; }
      case 'used-qty': usedDraft[d.p] = Math.max(0, (usedDraft[d.p] || 0) + +d.d); renderSheet(); break;
      case 'used-confirm': {
        const p = pt(j); j.products = j.products || [];
        p.items.forEach(i => { const n = usedDraft[i.pid] || 0, e = j.products.find(x => x.pid === i.pid); if (n > 0) { if (e) { e.qty = n; delete e.pending; } else j.products.push({ pid: i.pid, qty: n }); } else if (e && e.pending) j.products.splice(j.products.indexOf(e), 1); });
        p.used = true; log(j, 'Parts used recorded'); toast('Parts recorded · job cost updated'); backToComplete(); refreshAll(); break;
      }
      case 'sign': if (sheetKind === 'complete') { afterSheet = 'complete'; closeSheet(); setTimeout(() => openSheet('sign'), 380); } break;
      case 'sig-clear': initSign(); { const h = $('#sigHint'); if (h) h.style.display = ''; } break;
      case 'sig-save': if (!sigDirty) toast('Ask the customer to sign first'); else { j.sig = true; log(j, 'Customer signature captured'); toast('Signature saved'); backToComplete(); } break;
      case 'addPhoto': j.photos = (j.photos || 0) + 1; toast('Photo added (simulated)'); refreshCk(); break;
      case 'pay': j.paid = true; log(j, `Payment of ${money(invTotal(j))} recorded`); toast('Payment recorded'); refreshCk(); break;
    }
  });

  /* ---------- review panel copy for the new screens ---------- */
  const EV_PO = 'Productboard: field PO and parts access is a steady ask all year (97 of 314 tracked citations in 2026). Gong: the office wants to keep ordering authority, with technicians flagging “waiting on parts” on the job.';
  Object.assign(P, {
    'po-needs': ['Parts Needed', ['Reached from the new Parts tile on Job Details. It does not change the job status, so the workflow is not linear.', 'Search by name or SKU, or scan a barcode. Every product shows what is in stock, split into truck and warehouse. Today the catalog shows no availability.', 'Pick quantities and add notes. The main button follows permissions: Create Purchase Order, or Send Request to Office.', 'Parts already in stock can be used straight away without a PO.'], EV_PO],
    'po-form': ['PO / Request', ['The job and customer are prefilled. Only the fields a technician needs are shown; payment terms, shipping and the other web fields are left out.', 'If the job already has products, a prompt offers to add them. Quantities on the PO never change the job\'s own quantities.', 'New products can also be added to Job Products, and the screen says so for each one.', 'Prices and totals appear only for users allowed to see cost.', 'A technician who needs approval sees a Part Request instead: no PO number yet, vendor optional, no costs.'], EV_PO],
    'po-vendor': ['Vendor', ['Required for a PO. Optional preference on a request. The web form\'s vendor and payment terms come through.'], EV_PO],
    'po-review': ['Review', ['A compact summary before saving: number, vendor, job, products, costs where permitted and notes.', 'Saving confirms the PO and opens it in the job. A request goes to the office as Awaiting approval.'], EV_PO],
    'po-detail': ['Parts & POs', ['One place to see where the part is, who owns the next step and what happens next. The same eight steps run for both permission levels.', 'PO status uses Awaiting approval, Approved, Sent to vendor, Partially received, Received and Closed, with received and outstanding quantities and the inventory order once one exists.', 'Actions follow permissions: view, email, share and delete for purchasers; view and cancel for requests.', 'End Visit · Waiting for Parts closes this visit without implying the job is done.', 'Use the Demo button (bottom left) to play what the office, vendor and dispatch do.'], EV_PO],
    waiting: ['Waiting on Parts', ['Ends the visit, not the job. The sheet spells out the difference: this visit is complete, the overall job is not.', 'It restates the part, the PO or request status, the next owner and the expected next step.', 'The job stays on My Work as active work, with the parts state under it. Home moves on to your next job.', 'The status label is customer-defined; the prototype uses “Waiting on Parts”.'], 'Gong: techs update the status to “waiting on parts”, which notifies the office. Churn: techs unwilling to implement is the top Field Worker App cancel reason (24).'],
    used: ['Parts Used', ['Shown on the return visit. Defaults to what was received; adjust what was actually installed.', 'Saving adds the parts to the job and updates the invoice total.'], 'Parts recorded on the job feed the invoice and cost.'],
    addjobprods: ['Job Products', ['Pick which of the job\'s existing products go on the PO and how many. The job\'s own quantities stay as they are.'], EV_PO],
    sign: ['Customer signature', ['The one required item in the demo checklist. It mirrors the web status rule “Post-work signature is present”.'], 'Web: Edit Job status > Only allow to select status if…'],
  });
  P.complete = ['Complete', ['One sheet with the outcome, completion notes and a checklist that reads from existing job records.', 'Required items (here, only the customer signature) must be done before the main button works. Everything else is a reminder and never blocks.', 'Items show complete, incomplete or not applicable, each with an action that opens the relevant screen.', 'With purchasing and billing permissions, you also see the invoice, payments and balance, and finish with Complete Job.', 'Without them, financial details stay hidden and you finish with Ready for Office Review.', 'Which items warn and which block is a discovery question; this demo shows the concept.'], 'Churn: “Requires too many steps or clicks” is the top Field Worker App cancel reason (24 primary). Gong: customers want completion gatekeepers for signatures, photos and notes.'];
  P.job[1].push('A Parts tile starts the parts workflow from the job. Once parts exist, a Parts card shows the stage, owner and next step. Return visits add a card explaining why you are back.');

  root.dataset.theme = localStorage.getItem('sf-theme') || 'dark';
  root.dataset.font = localStorage.getItem('sf-font') || 'inter';
  renderChrome();
  reset();
})();
</script>
